# --- job1: tests unitaires ---
name: CI - FlaskApp

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -q


# --- job2: build + pus Docker ---

  docker:
    runs-on: ubuntu-latest
    needs: tests   # attend la fin du job tests; si tests échoue, ce job est annulé

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest .

      - name: Push image to Docker Hub
        if: success()   # n'exécute le push que si tout est OK
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest

