name: CI - FlaskApp

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # --- Job 1 : tests unitaires ---
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  # --- Job 2 : construction et publication de l'image Docker ---
  docker:
    runs-on: ubuntu-latest
    needs: tests   # ne démarre que si les tests passent
    # On ne publie l'image que pour un push sur master, pas pour une pull request
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # « latest » pour la dernière version, et le SHA du commit pour pouvoir revenir en arrière
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flaskapp:latest
            ${{ secrets.DOCKER_USERNAME }}/flaskapp:${{ github.sha }}
